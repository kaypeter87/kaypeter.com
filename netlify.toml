[build]
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm --filter @workspace/pk-site run build"
  publish = "artifacts/pk-site/dist/public"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "9"
  # vite.config.ts requires both, even though only BASE_PATH affects the build output.
  BASE_PATH = "/"
  PORT = "5173"
  NODE_ENV = "production"

# SPA fallback — every unknown path serves index.html so client-side routing works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
