[build]
  base = "."
  # --prod=false forces devDependencies to install. pk-site is a static Vite app,
  # so its build tools (vite, tailwind, plugins) all live in devDependencies and
  # would be skipped under Netlify's default NODE_ENV=production.
  command = "pnpm install --frozen-lockfile --prod=false && pnpm --filter @workspace/pk-site run build"
  publish = "artifacts/pk-site/dist/public"

[build.environment]
  NODE_VERSION = "24"
  # Must match the pnpm that wrote pnpm-lock.yaml, or the frozen install fails
  # with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH on the overrides block.
  PNPM_VERSION = "10.26.1"
  # vite.config.ts requires both, even though only BASE_PATH affects the build output.
  BASE_PATH = "/"
  PORT = "5173"

# SPA fallback — every unknown path serves index.html so client-side routing works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
